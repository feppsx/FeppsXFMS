<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — 360 Integrated</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <meta name="theme-color" content="#0f4c81" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f8fafc; color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
      padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      text-align: center;
    }
    h1 { margin: 0 0 8px; color: #0f4c81; font-size: 20px; }
    p  { margin: 0 0 16px; color: #475569; font-size: 14px; line-height: 1.5; }
    button {
      background: #0f4c81; color: #fff; border: 0; border-radius: 10px;
      padding: 10px 18px; font-weight: 500; cursor: pointer;
    }
    button:hover { background: #0d4271; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Reconnect to the internet to load new tickets. Any ticket pages you've already opened may still work from cache.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
